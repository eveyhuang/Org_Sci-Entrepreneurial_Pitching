- id: TURN-FUNC
  name: Turn function
  dimension: 0. Turn, exchange and decision types
  side: none
  tier: T2
  type: categorical
  unit: TURN
  observability: observable
  values:
  - presents
  - question
  - answer
  - accepts
  - challenges
  - social
  - hostile
  - repair
  - demonstrates
  - negotiates
  - decides
  - NONE
  definition: 'What the speaker does in this turn. PRESENTS: a founder delivers the prepared presentation.
    QUESTION: an investor requests information, explanation or substantiation about the product, the venture
    or the founders, or puts a claim to the founder in a way that calls for a reply. ANSWER: a founder
    responds to a question or to a challenge. ACCEPTS: an investor explicitly shows acceptance of what
    they heard — acknowledges understanding, endorses or positively assesses an answer or claim, says
    a concern is settled, or states liking, interest or intent short of a concrete offer. CHALLENGES:
    an investor asserts disagreement, doubt or a competing fact without inviting a reply. SOCIAL: a joke,
    compliment, tease or expression of goodwill directed at a person, or the return of one (shared laughter,
    a joined joke). HOSTILE: contempt, mockery, insult or dismissal of a person rather than a claim. REPAIR:
    a founder, after pushback or confusion, gives a materially different explanation or a revised claim;
    marks their own earlier statement as unclear, incomplete or wrong; hands the answer to a co-founder;
    steps in to fix a co-founder''s answer; or contradicts a co-founder''s earlier statement. DEMONSTRATES:
    talk that is part of showing, handing out, tasting or trying the product, by anyone. NEGOTIATES: talk
    about the terms of an offer that is not itself a decision. DECIDES: the turn in which a decision is
    spoken, together with the reasons the speaker gives for it in the same stretch of speech. NONE: a
    remark with none of these functions (logistics, an aside, a filler comment).'
  include_if: 'Give every turn exactly one function: the main thing the speaker does. When a speaker clearly
    does two different things in one stretch of speech (answers, then makes an offer; reacts, then asks
    a new question), split it into two consecutive turns by the same speaker. The one exception is a decision:
    an investor''s statement that they are out or are making an offer, with the reasons given alongside
    it, is one decides turn and is never split into a challenge or an accepts turn plus a decision. A
    remark is a question only when it asks for information about the product, the venture or the founders;
    a comment, an exclamation or a joke phrased as a question is not. A founder''s reply is an answer
    only when it replies to a question or a challenge.'
  exclude_if: 'Do not label hospitality or product-handling talk (which sample to taste, who has which
    item, how to open the package) as question or answer; it is demonstrates. Do not label a joke or a
    tease as question, answer or challenges; it is social. An investor''s confusion is a question when
    it asks for clarification and NONE otherwise. Do not label private states: an investor who "seems
    unconvinced" has no function unless they say or visibly do something attributable. Silence is never
    agreement.'
  provenance: 'Replaces the v3-dev3 `EV-KIND`. Sequence-closing thirds, pursuit and repair follow Schegloff
    (2007), Pomerantz (1984), Schegloff (1992); affiliation requires reciprocation (Driver & Gottman 2004;
    Glenn 2003); hostility is separated from assertive questioning (Clayman & Heritage 2002); handoff
    and rescue from Sacks, Schegloff & Jefferson (1974) and Marks, Mathieu & Zaccaro (2001). `demonstrates`,
    `negotiates`, `decides`, `drops_concern` and `expresses_interest` are original to this project (T3).
    v3-dev9 (2026-10-20): acknowledges, agrees, drops_concern and expresses_interest merged into accepts;
    social_bid and social_reciprocation into social; changed_explanation, self_correction, handoff, rescue
    and cofounder_contradiction into repair; trouble_signal removed. Pass-to-pass agreement of the merged
    values on 100 videos was 0.26 to 0.35 (plan v3 §7, M1) and two coders agreed on none of them above
    chance.'
- id: EX-KIND
  name: Exchange kind
  dimension: 0. Turn, exchange and decision types
  side: none
  tier: T2
  type: categorical
  unit: EXCHANGE
  observability: observable
  values:
  - substantive
  - social
  - demonstration
  - negotiation
  - NONE
  definition: 'An exchange is the whole back-and-forth about one matter: all the turns, by however many
    investors and founders, that belong to it. SUBSTANTIVE: questioning about one topic of the product,
    the venture or the founders — the questions, the answers, the follow-ups by any investor, and the
    reactions to the answers. SOCIAL: joking, teasing, compliments or hostility between people, not about
    the business. DEMONSTRATION: showing, handing out, tasting or trying the product, and the talk around
    it. NEGOTIATION: offers, counters and the discussion of terms. NONE: not used for a recorded exchange.'
  include_if: Start a substantive exchange when an investor opens a new topic and keep adding turns to
    it while the talk stays on that topic, whoever is speaking. A follow-up by a different investor on
    the same topic belongs to the same exchange. Follow-up questions that build on the previous answer
    stay in the same exchange, also when they move to a neighbouring detail of the same line of questioning
    (the price, then the cost to make it, then the margin). Open a new exchange only when a question starts
    a line of questioning that does not build on what was just said. If the panel later comes back to
    an earlier topic, add those later turns to the earlier exchange rather than opening a new one. Each
    turn belongs to at most one exchange; the prepared presentation, remarks with no function, and an
    investor's statement that they are out belong to none. A joke or tease that breaks into a substantive
    exchange is its own social exchange, and each separate stretch of showing or handling the product
    is its own demonstration exchange. There is one negotiation exchange per encounter, holding every
    offer, counter and discussion of terms; separate offers are told apart by their offer ids. A question
    about the ask or the valuation before any offer is a question with deal_terms in a substantive exchange;
    the negotiation exchange begins with the first offer.
  exclude_if: A change of speaker is not a change of exchange. A single question with no answer is still
    an exchange of one turn. Do not split one topic into several exchanges because several investors asked
    about it, and do not merge different topics because the same investor asked about them one after another.
  provenance: 'Returns to the conversation-analytic sequence (base pair plus expansions; Schegloff 2007)
    that v2 `EP-BOUND` translated, with three changes: no first-decision cutoff, several investors per
    exchange with individual closing states, and non-contiguous membership so that a topic can be reopened.
    Social and demonstration exchanges are original to this project and exist so that they are counted,
    not coded as questioning.'
- id: EX-TOPIC
  name: Exchange topic
  dimension: 0. Turn, exchange and decision types
  side: none
  tier: T1
  type: categorical
  unit: EXCHANGE
  observability: observable
  values:
  - customer_acquisition
  - go_to_market
  - market_opportunity
  - assets
  - self_promotion
  - sales
  - usage
  - vision
  - forecast
  - execution
  - safety_security
  - liability
  - competition
  - operating_efficiency
  - customer_retention
  - team_capabilities
  - deal_terms
  - other
  - NONE
  definition: What a substantive exchange is about, using the same sixteen concepts that are defined under
    the question concept (PR-CONCEPT), and deal_terms, for the ask, valuation, equity and deal structure.
    OTHER — a real business matter that none of the concepts above covers; the exchange's label names
    it. NONE — the exchange is social, demonstration or negotiation.
  include_if: 'Choose the one concept that the questions in the exchange are mainly after. When the questions
    in one exchange carry different concepts, choose the concept of the question that opened the line
    of questioning. Always give a short label in a few words naming the specific matter (for example:
    profit margin per unit).'
  exclude_if: Do not choose the topic from where the answer wandered; choose it from what was asked. Do
    not use a value that is not in the list.
  provenance: Uses the Kanze et al. (2018) Appendix B concepts so that exchanges and questions share one
    vocabulary. An earlier ten-item project list (v3-dev4 to v3-dev7) was dropped after the model mixed
    its values with the concept values (20 validation errors in two passes of one video). `other` exists
    so that uncovered matters are named and can be reviewed for recurring themes before the list is extended.
- id: DEC-KIND
  name: Decision kind
  dimension: 0. Turn, exchange and decision types
  side: none
  tier: T3
  type: categorical
  unit: DECISION
  observability: observable
  values:
  - offer
  - joins_offer
  - revises_offer
  - withdraws_offer
  - exit
  - re_entry
  - founder_accepts
  - founder_rejects
  - founder_counters
  - NONE
  definition: 'One observable investment decision or negotiation move. OFFER: an investor states a concrete
    offer (an amount and terms, or an unambiguous acceptance of the founders'' ask). JOINS_OFFER: an investor
    joins another investor''s standing offer. REVISES_OFFER: an investor changes the terms of their own
    standing offer. WITHDRAWS_OFFER: an investor retracts a standing offer. EXIT: an investor declares
    they are out. RE_ENTRY: an investor who exited comes back in with or toward an offer. FOUNDER_ACCEPTS
    / FOUNDER_REJECTS / FOUNDER_COUNTERS: the founders accept, decline or counter a specific offer. NONE:
    no decision; record nothing.'
  include_if: Record every decision by every investor in order, with the clock time at which the decisive
    words begin, the actor, and a shared `offer_id` for all moves that belong to the same offer (the original
    offer, joins, revisions, the founders' reply). Offers by different investors are separate offers unless
    one joins the other. Record decisions that occur after other investors have exited or offered. State
    the terms as spoken, and put the reasons the investor gives for the decision in the note.
  exclude_if: Interest and conditional remarks without a stated offer ("I'd do it if you had sales") are
    not offers; record them as `accepts` turns. A compliment is a `social` turn. Valuation discussion
    before any offer is a `question` turn carrying `deal_terms`, or a `negotiates` turn once an offer
    stands. Do not infer an exit from silence or from the video ending. Do not use outside knowledge of
    the show or the deal; record only what is on screen. Post-show closing is unobservable and is never
    recorded.
  provenance: Original to this project. v2 recorded only each investor's ever-offer and the first-decision
    time; v3 keeps the full ordered history so that analysis derives outcomes O1/O2 and applies its own
    history cut (design §10.1).
- id: PR-CONCEPT
  name: Question concept
  dimension: A. Investor question
  side: investor
  tier: T1
  type: categorical
  unit: TURN
  observability: observable
  applies_to: question
  values:
  - customer_acquisition
  - go_to_market
  - market_opportunity
  - assets
  - self_promotion
  - sales
  - usage
  - vision
  - forecast
  - execution
  - safety_security
  - liability
  - competition
  - operating_efficiency
  - customer_retention
  - team_capabilities
  - deal_terms
  - other
  - NONE
  definition: 'Which one of the concepts below the question is about: the sixteen venture-funding concepts,
    or deal terms. The concept, not the tone or the wording, decides the answer. Promotion concepts (concern
    with gains): CUSTOMER_ACQUISITION — how customers are won, obtained or onboarded. GO_TO_MARKET — launch,
    roll-out, market entry, positioning, branding, advertising, marketing, partnerships, distribution
    plans, retail and wholesale channels. MARKET_OPPORTUNITY — market size, demand, who the target customers
    are, market potential, expansion, whether the market is growing. ASSETS — intellectual property as
    an advantage, what makes the product different or unique, tangible and intangible assets. SELF_PROMOTION
    — the founder''s own experience, background, story and how the venture began, when the founder is
    invited to present themselves. SALES — sales and revenue, orders, buyers, the business model, monetisation,
    the price and pricing, licensing, scaling up selling. USAGE — who uses the product, what it is used
    for, use cases, the value to the user, product or feature extensions. VISION — the dream, aspiration,
    mission, ideal scenario, end goal. FORECAST — projections, growth trajectory, milestones targeted,
    what success would look like. Prevention concepts (concern with losses): EXECUTION — whether it works
    and can be delivered: testing, quality, logistics, process, progress to date, performance figures,
    feasibility, obstacles, validation. SAFETY_SECURITY — contingency plans, procedures in place, capacity,
    whether the infrastructure can be relied on. LIABILITY — legality, regulation, privacy, fraud, product
    liability. COMPETITION — competitors, competitive threat, copycats, lost or protected market share,
    defensibility. OPERATING_EFFICIENCY — cost, cost to make, cost to acquire a customer, overhead, margins,
    profit, the bottom line, break-even, saving money, cheaper alternatives, unit economics. CUSTOMER_RETENTION
    — whether customers come back, repeat purchase, retention, attrition, engagement. TEAM_CAPABILITIES
    — checking the team: who does what, what is done in-house or outsourced, the skills the team has or
    lacks, how many people there are. Deal terms (no frame): DEAL_TERMS — the ask, the valuation, equity,
    royalties, deal structure, what the investor would own or do, whether the founder needs an investor
    at all. OTHER — the question is about a real business matter that none of the concepts above covers;
    name that matter in a few words in the turn''s other_concept field. NONE — the question only repeats
    or asks to confirm something that was just said, or has no business subject at all.'
  include_if: 'Find the concept the question is mainly about by what it asks for, using the words listed
    for each concept. A plain factual question still has a concept: asking the price is sales, asking
    the cost to make it is operating_efficiency. When a question touches two concepts, choose the one
    it asks for first or mainly. Known close calls: the price of the product is sales, but the price of
    the company — the ask, the valuation, the equity — is deal_terms; how customers are won is customer_acquisition,
    but the cost of winning one is operating_efficiency; revenue or sales to date is sales, but profit
    and margins are operating_efficiency; projected sales are forecast; whether the market or trend will
    last or grow is market_opportunity, but a named rival or a copycat is competition; an invitation to
    the founder to tell their own background or story is self_promotion, but checking whether the team
    has the skills or people to do the work is team_capabilities.'
  exclude_if: 'A question about a CONSUMER''s problem that the product solves is usage or market_opportunity,
    not a prevention concept. A question about a safety or security PRODUCT is not safety_security, because
    the venture''s own safety is not in doubt. Do not use other or NONE to avoid a close call: use other
    only when no concept''s description fits, and NONE only for a repeat, a request to confirm, or a question
    with no business subject. The exchange topic uses this same list; there is no separate list of topics.
    Do not let the answer or any later decision inform the concept of the question.'
  provenance: 'Kanze, Huang, Conley & Higgins (2018), Appendix B, Tables B1 (nine promotion concepts)
    and B2 (seven prevention concepts); descriptions condensed from their Description column, and the
    two exclusion rules are theirs (p. 595). Replaces `PR-FRAME` from v3-dev6 after two passes disagreed
    on 19 framings in one video, 16 of them neutral-versus-framed on plain factual questions: the frame
    is now DERIVED from the concept (promotion concepts → promotion, prevention concepts → prevention,
    NONE → neutral), as their coders worked from the concept rubric. Their neutral category is "repeated
    intentions and those that lacked a distinct focus" (8.8% of questions). Their corpus is technology
    startups before venture capitalists; on consumer products safety_security and liability will be rare
    and operating_efficiency common — to be reported, not corrected. The close-call rules are this project''s
    reading of their tables. `other` with a free-text name is a project addition: uncovered matters (for
    example the founder''s own investment, or the valuation) are collected for human review and may become
    new concepts. Their Example column is not reproduced here; see the paper, and add project examples
    from development videos under **Examples**. deal_terms added in v3-dev9 (2026-10-20) as a project
    concept outside Kanze et al.''s sixteen, after valuation was the most frequent other on 100 videos
    and five of twelve coder concept disagreements in training were deal questions.'
  examples:
  - text: Kevin questions the high valuation, asking why he is asking for $1M for 5%. → deal_terms
    provenance: real
    source: st_aebb7e3764 turn 10
  - text: Daymond asks if he is investing in a piece of the original design firm. → deal_terms
    provenance: real
    source: st_8642720802 turn 61
  - text: Peter asks why they made the corporate structure so complicated. → deal_terms
    provenance: real
    source: st_8642720802 turn 67
  - text: Kevin asks what the current customer acquisition cost is. → operating_efficiency (a cost, not
      acquisition)
    provenance: real
    source: st_aebb7e3764 turn 31
- id: PR-SEV
  name: Question severity
  dimension: A. Investor question
  side: investor
  tier: T2
  type: ordinal
  scale:
  - 1
  - 3
  unit: TURN
  observability: observable
  applies_to: question
  definition: How strongly the question presses on the founder's claim — a property of what the question
    DOES, not of its tone.
  anchors:
  - value: 1
    description: Understanding-seeking. Requests a fact or clarification without contesting a claim or
      demanding its substantiation.
  - value: 2
    description: Verification-seeking. Asks the founder to substantiate a claim — a number, a named customer,
      a demonstration — without asserting that the claim is false.
  - value: 3
    description: 'Problematising. Contests the claim: names a contradiction, asserts a competing fact,
      or is built so that agreeing means conceding.'
  include_if: Code every question turn. Decide whether it requests information, requests support for a
    prior claim, or contests that claim.
  exclude_if: 'Tone does not set severity: a rude information request remains 1 and a polite challenge
    can be 3; hostility is a separate `hostile` turn. Do not use the founder''s answer or any later decision
    to infer how severe the question was.'
  provenance: Chapple, Pollock & D'Adderio (2022); Clayman & Heritage (2002); Danet & Bogoch (1980). Scale
    unchanged from archived v2 `PR-SEV`.
- id: RS-RESP
  name: Answer directness
  dimension: B. Founder answer
  side: founder
  tier: T2
  type: categorical
  unit: TURN
  observability: interpretive
  applies_to: answer
  values:
  - addresses
  - partial
  - deflects
  - NONE
  definition: 'Whether the answer supplies what the linked question(s) asked for. ADDRESSES: the requested
    information is given, favourable or not. PARTIAL: some components are answered and others are not,
    or the answer engages the topic while narrowing its terms; a genuine admission that the requested
    information is not known is partial. DEFLECTS: the requested information is absent and replaced by
    something else — a change of agenda, rehearsed pitch material, an attack on the question, or a refusal.
    NONE: the founder begins to respond but is cut off before supplying or withholding anything.'
  include_if: List what the linked question requests and check what this answer turn supplies. Judge this
    answer only; a later answer to a follow-up is its own turn.
  exclude_if: Do not penalise unfavourable facts, brevity, accent or nervousness. If the question itself
    asks whether the founder has a fact, an explicit negative fully addresses it. An inaudible or edited-out
    answer is missing (`not_observable` or `edited_gap`), not NONE.
  provenance: Bull & Mayer (1993); Bull (2003); Stivers & Hayashi (2010); Clayman (2001). Definition unchanged
    from archived v2 `RS-RESP`.
  examples:
  - text: Asked about his own investment and any outside funding, the founder states only that he initially
      put in fifty thousand dollars. → partial
    provenance: real
    source: st_1164b596f8 turn 25
  - text: Asked whether the business currently has any retail presence, the founder confirms she is not
      currently in retail stores. → addresses
    provenance: real
    source: st_b76e8a6734 turn 52
- id: RS-CONCEPT
  name: Answer concept
  dimension: B. Founder answer
  side: founder
  tier: T1
  type: categorical
  unit: TURN
  observability: observable
  applies_to: answer
  values:
  - customer_acquisition
  - go_to_market
  - market_opportunity
  - assets
  - self_promotion
  - sales
  - usage
  - vision
  - forecast
  - execution
  - safety_security
  - liability
  - competition
  - operating_efficiency
  - customer_retention
  - team_capabilities
  - deal_terms
  - other
  - NONE
  definition: Which one of the sixteen concepts listed under the question concept, or deal_terms (for
    the ask, valuation, equity and deal structure), the founder's answer is mainly about, judged from
    what the answer says. OTHER — a real business matter that none of the concepts above covers; name
    it in a few words in the turn's other_concept field. NONE — a bare acknowledgment (yes, no, right,
    a single word).
  include_if: 'Code the answer on its own content, with the same concept list and the same close-call
    rules as the question concept. A one-line factual answer takes the concept of the fact it gives: a
    price is sales, a cost is operating_efficiency. An answer may have a different concept from the question
    it replies to, for example when the founder is asked about costs and talks about growth.'
  exclude_if: Do not copy the question's concept onto the answer without considering what the answer says.
    Do not use NONE for a short factual answer.
  provenance: Kanze et al. (2018) coded 1,718 entrepreneur answers with the same Appendix B rubric; neutral
    answers are "single-word acknowledgments and other answers lacking distinct focus" (19.4%). Replaces
    `RS-FRAME`; the answer frame and motivational matching are derived in analysis from the two concept
    codes.
- id: RS-EVID
  name: Checkable support
  dimension: B. Founder answer
  side: founder
  tier: T2
  type: binary
  unit: TURN
  observability: observable
  applies_to: answer
  definition: The answer grounds at least one claim relevant to the question in a checkable specific —
    a stated figure with its unit, a named customer or partner, a dated event, a described test or observation
    — as opposed to assertion alone.
  include_if: A requested price or sales figure with unit and scope itself counts. Code the presence of
    stated support in this answer turn. For a named customer or partner, state what they bought, tested,
    or agreed to; a name alone does not count.
  exclude_if: Vague quantifiers, unsupported projections, self-awarded rankings and confident delivery
    alone. Code presence of support, not its truth or persuasiveness.
  provenance: Chen, Yao & Kotha (2009) item 5; Toulmin (1958); Hassan et al. (2017). Unchanged from archived
    v2 `RS-EVID`.
- id: RS-UNCERT
  name: Admitted uncertainty or concession
  dimension: B. Founder answer
  side: founder
  tier: T2
  type: binary
  unit: TURN
  observability: observable
  applies_to: answer
  definition: 'The founder explicitly claims no-knowledge or concedes the investor''s point: says they
    do not know, do not have the figure, have not tested it, or that the investor is right.'
  include_if: An explicit knowledge limit, an unperformed test or measurement, or acceptance of an investor's
    stated correction or counterclaim, within this answer turn.
  exclude_if: A known negative fact given in answer to an information request (no patent, no sales) is
    not uncertainty. Hedges that still assert, polite thanks, and a filler admission immediately followed
    by the requested answer do not count.
  provenance: Tsui (1991); Menichetti et al. (2021); Prince, Frader & Bosk (1982). Unchanged from archived
    v2 `RS-UNCERT`.
- id: PREP-SUBS
  name: Answer substance
  dimension: B. Founder answer
  side: founder
  tier: T2
  type: ordinal
  scale:
  - 1
  - 5
  unit: TURN
  observability: interpretive
  applies_to: answer
  definition: Substance and depth of the answer, conditional on what was asked. Judge content, not delivery.
  anchors:
  - value: 1
    description: No substance. Restates the value proposition or a slogan; nothing new is said in answer.
  - value: 2
    description: Thin. One relevant point at a general level, without mechanism or detail.
  - value: 3
    description: Adequate. Relevant content with some detail — a mechanism, a number, or an example —
      but not developed further.
  - value: 4
    description: Substantial. Several specific, connected points; the founder explains how or why, not
      only what.
  - value: 5
    description: In-depth. Detailed and layered — unit-level specifics, named assumptions, and what would
      change them.
  include_if: The answer turn contains about ten founder words or more. A short answer can fully address
    a simple question; that is recorded by directness, not here.
  exclude_if: 'Fewer than about ten words: return no value with missing reason `too_short`, not a low
    score. Do not score fluency, confidence, charisma, investor reactions or outcomes.'
  provenance: Chen, Yao & Kotha (2009). Scale unchanged from archived v2 `PREP-SUBS`.
- id: PREP-COH
  name: Answer coherence
  dimension: B. Founder answer
  side: founder
  tier: T2
  type: ordinal
  scale:
  - 1
  - 5
  unit: TURN
  observability: interpretive
  applies_to: answer
  definition: 'How logically the answer hangs together: premises support conclusions and the parts do
    not conflict.'
  anchors:
  - value: 1
    description: Incoherent. Points do not connect, or the answer contradicts itself.
  - value: 2
    description: Loose. A conclusion is stated but the steps to it are missing or jump.
  - value: 3
    description: Followable. The main line of reasoning is clear, with a gap or an unsupported step.
  - value: 4
    description: Coherent. Each step follows; the answer reaches its conclusion without gaps.
  - value: 5
    description: Tightly reasoned. Explicit structure — premise, implication, conclusion — and anticipates
      the obvious objection.
  include_if: The answer contains enough argument to assess how premises support conclusions.
  exclude_if: 'An isolated fact, a bare knowledge limit or an answer with no argument structure: return
    no value with missing reason `not_applicable`. Do not penalise accent, disfluency or nervousness,
    or infer coherence from investor agreement.'
  provenance: Chen et al. (2009). Scale unchanged from archived v2 `PREP-COH`, which showed range restriction
    (most codable answers scored 4).
- id: PREP-CTX
  name: Answer contextualisation
  dimension: B. Founder answer
  side: founder
  tier: T2
  type: ordinal
  scale:
  - 1
  - 5
  unit: TURN
  observability: interpretive
  applies_to: answer
  definition: How well the answer relates the venture to its wider context — market, competitors, category,
    regulation, trends.
  anchors:
  - value: 1
    description: None. The answer stays entirely inside the venture's own operations although context
      was relevant.
  - value: 2
    description: Name-drop. A competitor, market or trend is mentioned with no stated relationship.
  - value: 3
    description: Located. One relationship is stated — how the venture differs from an alternative, or
      why a trend matters to it.
  - value: 4
    description: Situated. Several contextual relationships, tied to the venture's strategy.
  - value: 5
    description: 'Integrated. Context drives the reasoning: positioning against named alternatives and
      market dynamics, with consequences drawn.'
  include_if: The question or the answer makes an external relationship relevant (competition, positioning,
    regulation, a trend).
  exclude_if: 'A purely internal price, inventory or operations question: return no value with missing
    reason `not_applicable`. Do not require a named competitor for anchors 2–4.'
  provenance: Chen et al. (2009). Scale unchanged from archived v2 `PREP-CTX`.
- id: PREP-CONSIST
  name: Unresolved claim conflicts
  dimension: C. Claim consistency
  side: founder
  tier: T2
  type: count
  unit: PITCH
  observability: observable
  definition: Pairs of founder statements anywhere in the encounter (prepared presentation or answers)
    that concern the same referent and metric with matching period, units and scope and cannot both be
    true. Each pair is listed once with both turns; the count is the length of the list. It measures stated
    consistency, not honesty or external accuracy.
  include_if: Both statements are locatable in recorded turns; the same referent, metric, period, units
    and scope are established before incompatibility is judged. Mark `reconciled` true when a founder
    later corrects or reconciles the pair on screen.
  exclude_if: Rounding or refinement, changes in period or scope, actual versus forecast, conditional
    statements, and a revised offer or counter-offer in negotiation. Missing comparability is not a contradiction.
  provenance: de Marneffe, Rafferty & Manning (2008); Deeb et al. (2018). Decision rule unchanged from
    archived v2 `PREP-CONSIST`; v3 covers the whole encounter and keeps the time of each claim.
- id: PRES-SUBS
  name: Presentation substance
  dimension: D. Prepared presentation
  side: founder
  tier: T2
  type: ordinal
  scale:
  - 1
  - 5
  unit: PITCH
  observability: interpretive
  applies_to: prepared
  definition: 'Substance and depth of the prepared presentation: what the founders say about how the business
    works, judged on content, not delivery.'
  anchors:
  - value: 1
    description: No substance. A slogan and an ask; nothing about how the business works.
  - value: 2
    description: Thin. One or two general claims without mechanism or detail.
  - value: 3
    description: Adequate. Relevant content with some detail — a mechanism, a number, an example — not
      developed further.
  - value: 4
    description: Substantial. Several specific, connected points; how or why, not only what.
  - value: 5
    description: In-depth. Detailed and layered — unit-level specifics, named assumptions, and what would
      change them.
  include_if: Judge from the prepared presentation spans only. The investors' later questions are not
    evidence about the presentation.
  exclude_if: 'Do not score fluency, confidence, charisma or the ask itself. No prepared presentation:
    return no value with missing reason not_applicable; a presentation cut by an edit: edited_gap.'
  provenance: Chen, Yao & Kotha (2009) items 1–5 (substance and depth; coherent and logical; related to
    the broader context; cited facts), which Pollack, Rutherford & Nagy (2012) rated once per pitch on
    Shark Tank and Dragons' Den; here the same items as the answer codes PREP-SUBS, PREP-COH, PREP-CTX
    and RS-EVID, applied to the prepared presentation so that preparedness under questioning can be compared
    with preparedness displayed (refocus plan §10). Added in v3-dev9.
- id: PRES-COH
  name: Presentation coherence
  dimension: D. Prepared presentation
  side: founder
  tier: T2
  type: ordinal
  scale:
  - 1
  - 5
  unit: PITCH
  observability: interpretive
  applies_to: prepared
  definition: 'How logically the presentation hangs together: premises support conclusions and the parts
    do not conflict.'
  anchors:
  - value: 1
    description: Incoherent. Points do not connect, or the presentation contradicts itself.
  - value: 2
    description: Loose. A conclusion is stated but the steps to it are missing or jump.
  - value: 3
    description: Followable. The main line of reasoning is clear, with a gap or an unsupported step.
  - value: 4
    description: Coherent. Each step follows; the presentation reaches its conclusion without gaps.
  - value: 5
    description: Tightly reasoned. Explicit structure — premise, implication, conclusion — and anticipates
      the obvious objection.
  include_if: Judge from the prepared presentation spans only. The investors' later questions are not
    evidence about the presentation.
  exclude_if: 'Do not penalise accent, disfluency or nervousness, or infer coherence from investor agreement.
    No prepared presentation: return no value with missing reason not_applicable; a presentation cut by
    an edit: edited_gap.'
  provenance: Chen, Yao & Kotha (2009) items 1–5 (substance and depth; coherent and logical; related to
    the broader context; cited facts), which Pollack, Rutherford & Nagy (2012) rated once per pitch on
    Shark Tank and Dragons' Den; here the same items as the answer codes PREP-SUBS, PREP-COH, PREP-CTX
    and RS-EVID, applied to the prepared presentation so that preparedness under questioning can be compared
    with preparedness displayed (refocus plan §10). Added in v3-dev9.
- id: PRES-CTX
  name: Presentation contextualisation
  dimension: D. Prepared presentation
  side: founder
  tier: T2
  type: ordinal
  scale:
  - 1
  - 5
  unit: PITCH
  observability: interpretive
  applies_to: prepared
  definition: How well the presentation relates the venture to its wider context — market, competitors,
    category, regulation, trends.
  anchors:
  - value: 1
    description: None. The presentation stays entirely inside the venture's own operations although a
      market, a competitor or a trend was relevant.
  - value: 2
    description: Name-drop. A competitor, market or trend is mentioned with no stated relationship.
  - value: 3
    description: Located. One relationship is stated — how the venture differs from an alternative, or
      why a trend matters to it.
  - value: 4
    description: Situated. Several contextual relationships, tied to the venture's strategy.
  - value: 5
    description: 'Integrated. Context drives the reasoning: positioning against named alternatives and
      market dynamics, with consequences drawn.'
  include_if: Judge from the prepared presentation spans only. The investors' later questions are not
    evidence about the presentation.
  exclude_if: 'Do not require a named competitor for anchors 2–4. No prepared presentation: return no
    value with missing reason not_applicable; a presentation cut by an edit: edited_gap.'
  provenance: Chen, Yao & Kotha (2009) items 1–5 (substance and depth; coherent and logical; related to
    the broader context; cited facts), which Pollack, Rutherford & Nagy (2012) rated once per pitch on
    Shark Tank and Dragons' Den; here the same items as the answer codes PREP-SUBS, PREP-COH, PREP-CTX
    and RS-EVID, applied to the prepared presentation so that preparedness under questioning can be compared
    with preparedness displayed (refocus plan §10). Added in v3-dev9.
- id: PRES-EVID
  name: Checkable specifics in the presentation
  dimension: D. Prepared presentation
  side: founder
  tier: T2
  type: count
  unit: PITCH
  observability: observable
  applies_to: prepared
  definition: The number of distinct claims in the prepared presentation that are grounded in a checkable
    specific — a stated figure with its unit, a named customer or partner, a dated event, a described
    test or observation.
  include_if: Count each distinct supported claim once; the ask (amount and equity) is not counted. Zero
    is a value, not missing.
  exclude_if: 'Vague quantifiers, unsupported projections, self-awarded rankings and confident delivery
    alone. Count stated support, not its truth or persuasiveness. No prepared presentation: return no
    value with missing reason not_applicable; a presentation cut by an edit: edited_gap.'
  provenance: Chen, Yao & Kotha (2009) items 1–5 (substance and depth; coherent and logical; related to
    the broader context; cited facts), which Pollack, Rutherford & Nagy (2012) rated once per pitch on
    Shark Tank and Dragons' Den; here the same items as the answer codes PREP-SUBS, PREP-COH, PREP-CTX
    and RS-EVID, applied to the prepared presentation so that preparedness under questioning can be compared
    with preparedness displayed (refocus plan §10). Added in v3-dev9.
